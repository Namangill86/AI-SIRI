name: SiriAI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  SiriAI:
    type: application
    platform: iOS
    sources: [Sources/App, Sources/AI, Sources/Shared, Sources/Intents]
    dependencies:
      - target: SiriAIWidget
    entitlements:
      path: Sources/SiriAI.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.siriai]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SiriAI
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.example.siriai
            CFBundleURLSchemes: [siriai]
        NSRemindersFullAccessUsageDescription: SiriAI creates reminders when you ask it to.
        NSCalendarsFullAccessUsageDescription: SiriAI reads and creates calendar events when you ask it to.
        NSSpeechRecognitionUsageDescription: SiriAI turns your voice into text.
        NSMicrophoneUsageDescription: SiriAI listens when you tap the mic.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.siriai
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SiriAIWidget:
    type: app-extension
    platform: iOS
    sources: [Sources/Widget, Sources/AI, Sources/Shared]
    entitlements:
      path: Sources/SiriAIWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.siriai]
    info:
      path: Sources/WidgetInfo.plist
      properties:
        CFBundleDisplayName: SiriAI
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.siriai.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXT"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
